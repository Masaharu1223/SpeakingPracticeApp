name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Type Check / Lint / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @speaking-practice/types run build

      - name: Type check
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build (frontend)
        run: pnpm --filter @speaking-practice/frontend run build

      - name: Build (backend)
        run: pnpm --filter @speaking-practice/backend run build
